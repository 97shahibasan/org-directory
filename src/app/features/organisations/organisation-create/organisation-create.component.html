<section class="create">
  <h2>{{ 'create.heading' | t }}</h2>

  @if (triedSubmit() && (form.invalid || nameTaken())) {
    <p class="error-banner">{{ 'create.errors.formInvalid' | t }}</p>
  }

  <form [formGroup]="form" (ngSubmit)="onSubmit()">
    <label class="field">
      <span>{{ 'create.name' | t }}</span>
      <input type="text" formControlName="name" />
      @if (showError('name') && form.controls.name.hasError('required')) {
        <small>{{ 'create.errors.required' | t }}</small>
      }
      @if (showError('name') && form.controls.name.hasError('minlength')) {
        <small>{{ 'create.errors.nameMin' | t }}</small>
      }
      @if (showError('name') && form.controls.name.hasError('maxlength')) {
        <small>{{ 'create.errors.nameMax' | t }}</small>
      }
      @if ((showError('name') || triedSubmit()) && nameTaken()) {
        <small>{{ 'create.errors.nameUnique' | t }}</small>
      }
    </label>

    <label class="field">
      <span>{{ 'create.status' | t }}</span>
      <select formControlName="status">
        <option value="active">{{ 'status.active' | t }}</option>
        <option value="inactive">{{ 'status.inactive' | t }}</option>
        <option value="suspended">{{ 'status.suspended' | t }}</option>
      </select>
    </label>

    <label class="field">
      <span>{{ 'create.ownerEmail' | t }}</span>
      <input type="email" formControlName="ownerEmail" />
      @if (showError('ownerEmail') && form.controls.ownerEmail.hasError('required')) {
        <small>{{ 'create.errors.required' | t }}</small>
      }
      @if (showError('ownerEmail') && form.controls.ownerEmail.hasError('email')) {
        <small>{{ 'create.errors.email' | t }}</small>
      }
    </label>

    <label class="field">
      <span>{{ 'create.memberCount' | t }}</span>
      <input type="number" formControlName="memberCount" min="0" />
    </label>

    <div class="actions">
      <button type="button" class="cancel" (click)="cancelled.emit()">
        {{ 'create.cancel' | t }}
      </button>
      <button type="submit" class="save">{{ 'create.submit' | t }}</button>
    </div>
  </form>
</section>
