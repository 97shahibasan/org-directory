<div class="filters">
  <label class="field">
    <span>{{ 'filters.searchLabel' | t }}</span>
    <input
      type="search"
      [ngModel]="orgService.search()"
      (ngModelChange)="onSearch($event)"
      [placeholder]="'filters.searchPlaceholder' | t"
    />
  </label>

  <label class="field">
    <span>{{ 'filters.statusLabel' | t }}</span>
    <select [ngModel]="orgService.statusFilter()" (ngModelChange)="onStatus($event)">
      <option value="all">{{ 'filters.statusAll' | t }}</option>
      <option value="active">{{ 'status.active' | t }}</option>
      <option value="inactive">{{ 'status.inactive' | t }}</option>
      <option value="suspended">{{ 'status.suspended' | t }}</option>
      <option value="unknown">{{ 'status.unknown' | t }}</option>
    </select>
  </label>

  @if (orgService.search() || orgService.statusFilter() !== 'all') {
    <button type="button" class="clear" (click)="clear()">
      {{ 'filters.clear' | t }}
    </button>
  }
</div>
