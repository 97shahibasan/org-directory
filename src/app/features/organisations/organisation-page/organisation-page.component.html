<div class="page">
  <header class="hero">
    <div>
      <h1>{{ 'app.title' | t }}</h1>
      <p>{{ 'app.subtitle' | t }}</p>
    </div>

    <button type="button" class="add-btn" (click)="openDialog()">
      {{ 'nav.create' | t }}
    </button>
  </header>

  <h2>{{ 'list.heading' | t }}</h2>

  <app-organisation-filter />

  <app-organisation-list />
</div>

@if (showDialog()) {
  <div class="backdrop" (click)="closeDialog()">
    <div class="dialog" (click)="$event.stopPropagation()">
      <button type="button" class="close-btn" (click)="closeDialog()">×</button>
      <app-organisation-create (saved)="closeDialog()" (cancelled)="closeDialog()" />
    </div>
  </div>
}
